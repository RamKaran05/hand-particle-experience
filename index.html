<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hand Particles V2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #video-input { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #00ffcc; border-radius: 8px; transform: scaleX(-1); }
        
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 2;
            color: #00ffcc; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 12px;
            pointer-events: none; border: 1px solid #333;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
        .gesture-item { margin: 8px 0; font-size: 0.85rem; display: flex; align-items: center; }
        .gesture-item b { width: 100px; color: #00ffcc; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        button {
            padding: 15px 30px; font-size: 1.2rem; background: #00ffcc; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Hand Particle Experience</h1>
        <p>Allow camera access to control particles with gestures</p>
        <button id="start-btn">START EXPERIENCE</button>
    </div>

    <div id="ui">
        <h1>Gestures</h1>
        <div class="gesture-item"><b>🖐 5 Fingers</b> Firework</div>
        <div class="gesture-item"><b>✌️ 2 Fingers</b> Heart</div>
        <div class="gesture-item"><b>🤟 3 Fingers</b> Saturn</div>
        <div class="gesture-item"><b>☝️ 1 Finger</b> Flower</div>
        <div class="gesture-item"><b>✊ Fist</b> Black Hole</div>
        <div class="gesture-item"><b>🤏 Pinch</b> Scale Size</div>
    </div>

    <video id="video-input" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const PARTICLE_COUNT = 10000;
        const PARTICLE_SIZE = 0.12;
        
        let scene, camera, renderer, particles, particleGeometry;
        let positions = []; // Array of Float32Arrays for each shape
        const shapeKeys = ['sphere', 'heart', 'flower', 'saturn', 'collapse', 'firework'];
        let shapes = {}; 
        
        let currentShapeIdx = 0;
        let targetShapeIdx = 0;
        let lerpAmount = 0;
        
        let expansionFactor = 1.0;
        let rotationSpeed = { x: 0, y: 0.002 };
        let hueBase = 0.5;

        // --- 1. Pre-calculate Shapes (The Math) ---
        function precalculateShapes() {
            shapeKeys.forEach(key => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const idx = i * 3;
                    const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                    const p = (i / PARTICLE_COUNT) * Math.PI;
                    let x, y, z;

                    if (key === 'heart') {
                        const phi = Math.random() * Math.PI * 2;
                        x = 16 * Math.pow(Math.sin(phi), 3) * 0.3;
                        y = (13 * Math.cos(phi) - 5 * Math.cos(2*phi) - 2 * Math.cos(3*phi) - Math.cos(4*phi)) * 0.3;
                        z = (Math.random() - 0.5) * 3;
                    } else if (key === 'flower') {
                        const r = 6 * Math.cos(4 * t);
                        x = r * Math.cos(t);
                        y = r * Math.sin(t);
                        z = (Math.random() - 0.5) * 2;
                    } else if (key === 'saturn') {
                        if (i < PARTICLE_COUNT * 0.6) { // Planet
                            const r = 3.5;
                            const theta = Math.random() * Math.PI * 2;
                            const phi = Math.acos((Math.random() * 2) - 1);
                            x = r * Math.sin(phi) * Math.cos(theta);
                            y = r * Math.sin(phi) * Math.sin(theta);
                            z = r * Math.cos(phi);
                        } else { // Rings
                            const r = 6 + Math.random() * 2.5;
                            const theta = Math.random() * Math.PI * 2;
                            x = r * Math.cos(theta);
                            z = r * Math.sin(theta);
                            y = (Math.random() - 0.5) * 0.3;
                        }
                    } else if (key === 'collapse') {
                        const r = Math.random() * 0.5;
                        x = (Math.random()-0.5) * r; y = (Math.random()-0.5) * r; z = (Math.random()-0.5) * r;
                    } else if (key === 'firework') {
                        const r = 7 + Math.random() * 5;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    } else { // Default Sphere
                        const r = 6;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }
                    arr[idx] = x; arr[idx+1] = y; arr[idx+2] = z;
                }
                shapes[key] = arr;
            });
        }

        // --- 2. Initialize ThreeJS ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 18;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            particleGeometry = new THREE.BufferGeometry();
            const initialPos = new Float32Array(shapes['sphere']);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(initialPos, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.7,
                map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png'),
                depthWrite: false
            });

            particles = new THREE.Points(particleGeometry, material);
            scene.add(particles);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 3. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const posAttr = particleGeometry.attributes.position;
            const colAttr = particleGeometry.attributes.color;
            
            const targetData = shapes[shapeKeys[targetShapeIdx]];
            const colorObj = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                
                // Smooth Lerp Position
                posAttr.array[idx] += (targetData[idx] * expansionFactor - posAttr.array[idx]) * 0.1;
                posAttr.array[idx+1] += (targetData[idx+1] * expansionFactor - posAttr.array[idx+1]) * 0.1;
                posAttr.array[idx+2] += (targetData[idx+2] * expansionFactor - posAttr.array[idx+2]) * 0.1;

                // Color based on shape and hand X
                let h = (hueBase + (i / PARTICLE_COUNT) * 0.2) % 1.0;
                let s = 0.8, l = 0.6;
                
                if (shapeKeys[targetShapeIdx] === 'heart') h = 0.95;
                if (shapeKeys[targetShapeIdx] === 'collapse') l = 0.2;

                colorObj.setHSL(h, s, l);
                colAttr.array[idx] = colorObj.r;
                colAttr.array[idx+1] = colorObj.g;
                colAttr.array[idx+2] = colorObj.b;
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            particles.rotation.y += rotationSpeed.y;
            particles.rotation.x += rotationSpeed.x;

            renderer.render(scene, camera);
        }

        // --- 4. MediaPipe Setup ---
        async function setupHandTracking() {
            // Load scripts dynamically to ensure order
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js");

            const videoElement = document.getElementById('video-input');
            const hands = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const marks = results.multiHandLandmarks[0];
                    
                    // Count Fingers
                    let up = 0;
                    if (marks[8].y < marks[6].y) up++; // Index
                    if (marks[12].y < marks[10].y) up++; // Middle
                    if (marks[16].y < marks[14].y) up++; // Ring
                    if (marks[20].y < marks[18].y) up++; // Pinky
                    
                    // Thumb
                    const thumbDist = Math.hypot(marks[4].x - marks[17].x, marks[4].y - marks[17].y);
                    if (thumbDist > 0.15) up++;

                    // Map fingers to shape index
                    if (up === 5) targetShapeIdx = 5; // firework
                    else if (up >= 3) targetShapeIdx = 3; // saturn
                    else if (up === 2) targetShapeIdx = 1; // heart
                    else if (up === 1) targetShapeIdx = 2; // flower
                    else if (up === 0) targetShapeIdx = 4; // collapse
                    
                    // Pinch for Scale
                    const pinch = Math.hypot(marks[8].x - marks[4].x, marks[8].y - marks[4].y);
                    expansionFactor = THREE.MathUtils.mapLinear(pinch, 0.05, 0.25, 0.5, 2.5);

                    // Hand position for Color and Rotation
                    hueBase = marks[9].x; 
                    rotationSpeed.y = (marks[9].x - 0.5) * 0.05;
                    rotationSpeed.x = (marks[9].y - 0.5) * 0.05;

                } else {
                    targetShapeIdx = 0; // Back to sphere
                    rotationSpeed.y = 0.002;
                    rotationSpeed.x *= 0.95;
                }
            });

            const camera = new window.Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start();
        }

        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                document.head.appendChild(s);
            });
        }

        // --- Start Trigger ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            precalculateShapes();
            initThree();
            animate();
            setupHandTracking();
        });

    </script>
</body>
</html>>
